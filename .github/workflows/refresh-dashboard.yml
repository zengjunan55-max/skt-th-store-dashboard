name: Refresh Dashboard Data

on:
  workflow_dispatch:
    inputs:
      source:
        description: Trigger source
        required: false
        default: manual
      requested_at:
        description: Request timestamp
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: refresh-dashboard-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip openpyxl

      - name: Build latest deploy data
        run: python tools/build_deploy_data.py

      - name: Commit refreshed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            store-trend-data-stores.js \
            store-trend-data-main.js \
            store-trend-data-inner.js \
            store-trend-data-outer.js \
            store-trend-data-brand.js \
            product-trend-data-main.js \
            product-trend-data-inner.js \
            product-trend-data-outer.js \
            product-trend-data-brand.js \
            sp-tt-sales-data.js \
            tools/build_deploy_data.py
          if git diff --cached --quiet; then
            echo "No dashboard data changes to commit."
            exit 0
          fi
          commit_date="$(date -u +%F)"
          git commit -m "Refresh dashboard data for ${commit_date}"
          git push origin HEAD:main
